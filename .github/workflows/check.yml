name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The lint policy lives in Cargo.toml ([workspace.lints]) and clippy.toml. Sites pin this
# repository by commit, so main must always pass everything here.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install   # reads rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo test --locked --workspace
